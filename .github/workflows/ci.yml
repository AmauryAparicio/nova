name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  ci:
    name: CI (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, native, server, tui, docs]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx turbo run lint --filter=${{ matrix.app }}

      # Build runs before typecheck: web's routeTree.gen (TanStack Router's
      # generated route tree) is only produced by the Vite plugin during a
      # build, and web's typecheck fails without it. Running build first is
      # harmless for every other app -- it doesn't depend on typecheck output.
      - name: Build
        if: matrix.app != 'native' && matrix.app != 'tui'
        run: bunx turbo run build --filter=${{ matrix.app }}
        env:
          # TanStack Start's prerender step executes @nova/env/web validation
          # at build time; web is the only app that needs this. A dummy URL
          # is sufficient -- no real server needs to be reachable.
          VITE_SERVER_URL: http://localhost:3000

      - name: Typecheck
        run: bunx turbo run check-types --filter=${{ matrix.app }}
